let order=DATA.map(x=>x.id),filter="all",index=0,shown=1,results={};
const $=s=>document.getElementById(s);
const visible=()=>order.filter(id=>filter==="all"||DATA[id-1].cat===filter);
function render(){let ids=visible();if(index>=ids.length)index=0;const x=DATA[ids[index]-1];$("number").textContent="No. "+x.id;$("category").textContent=({person:"人物・who",animal:"動物・which",object:"物・that"})[x.cat];$("picture").src=x.img;$("answer").textContent=x.jp;$("english").textContent=x.en;
$("hints").innerHTML=x.hints.map((h,i)=>i<shown?`<div class="hint"><b>HINT ${i+1}</b>${h}</div>`:`<div class="covered">Hint ${i+1} はまだ表示していません</div>`).join("");
$("reveal").disabled=shown>=3;$("reveal").textContent=shown>=3?"ヒントはすべて表示済み":`Hint ${shown+1} を表示`;
$("position").textContent=`${index+1} / ${ids.length}`;$("total").textContent=`記録 ${Object.keys(results).length}問 / ${Object.values(results).reduce((a,b)=>a+b,0)}点`;
document.querySelectorAll("[data-score]").forEach(b=>b.classList.toggle("active",results[x.id]===Number(b.dataset.score)));
}
function move(d){index=(index+d+visible().length)%visible().length;shown=1;render()}
$("next").onclick=()=>move(1);$("prev").onclick=()=>move(-1);
$("reveal").onclick=()=>{shown=Math.min(3,shown+1);render()};
$("hide").onclick=()=>{shown=1;render()};
$("filter").onchange=e=>{filter=e.target.value;index=0;shown=1;render()};
$("shuffle").onclick=()=>{for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}index=0;shown=1;render()};
$("reset").onclick=()=>{if(confirm("得点をリセットしますか？")){results={};render()}};
document.querySelectorAll("[data-score]").forEach(b=>b.onclick=()=>{results[visible()[index]]=Number(b.dataset.score);render()});
render();
</script></body></html>
